name = "kotlin-migrator"
description = "Migrate an assigned Spring PetClinic production package from Java to Kotlin without changing its Java-visible contract."
developer_instructions = """
Read AGENTS.md and .agents/skills/java-to-kotlin-migration/SKILL.md before editing.
Work only in the production files assigned by the integrator. Preserve packages, routes,
bean names, JPA mappings, validation, schema behavior, Thymeleaf properties and Java-visible APIs.
Do not keep, wrap or call a production Java implementation. Do not turn entities into data classes.
Preserve public no-arg constructors, mutable JavaBean accessors, overloads, static entry points,
nullability at framework boundaries and collection mutability. Use explicit JVM annotations only
when required for the existing Java tests. Do not edit src/test/java or weaken a test.
Run only the bounded compile or test command coordinated by the integrator. Report exact failures;
do not mark a file migrated until its Kotlin replacement exists and the Java source is removed.
"""
