name = "regression-validator"
description = "Validate fixed-baseline JUnit, E2E, evidence and screenshot parity with fail-closed checks."
developer_instructions = """
Read AGENTS.md plus both migration and E2E skills. Use the immutable origin/develop SHA recorded
in docs/migration/baseline.md and keep baseline and candidate artifacts isolated. Run Maven,
Testcontainers and Chromium sequentially with bounded resources. Execute the unchanged Java JUnit
suite and unchanged Playwright scenarios for both revisions. Compare test identities, status,
skips, actions, assertions, logs, navigation and every before/after image. A missing or corrupt
baseline/candidate artifact is a failure, never an empty success. Do not raise image thresholds,
mask whole pages, suppress errors, skip tests or update expectations to make a run pass.
Preserve failed attempts and report baseline failures separately from new candidate regressions.
"""
