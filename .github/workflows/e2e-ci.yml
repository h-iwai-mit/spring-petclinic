name: CI - JUnit and Playwright E2E

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  junit:
    name: JUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit tests
        run: ./mvnw -B test

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E verification
        env:
          MAVEN_OPTS: -Xmx1024m
          JAVA_TOOL_OPTIONS: -Xmx1024m
        run: npm run e2e:verify

      - name: Upload Playwright report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            e2e/evidence/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
